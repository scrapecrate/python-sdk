[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapecrate"
version = "1.0.0"
description = "Official Python SDK for the ScrapeCrate API: YouTube, Google Maps, Trustpilot and Meta Ad Library data with one API key"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "ScrapeCrate" }]
keywords = ["api", "sdk", "scraping", "youtube", "google maps", "trustpilot", "meta ad library", "web data"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.6.0"]

[project.urls]
Homepage = "https://scrapecrate.com"
Documentation = "https://scrapecrate.com/docs/sdks"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapecrate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
extend-exclude = ["src/scrapecrate/_generated.py"]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.hatch.build.targets.sdist]
exclude = ["tests"]
